name: Wayvia delivery gates
on: [push, pull_request, workflow_dispatch]
jobs:
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install uv==0.9.7
      - run: uv sync --locked
      - run: make check
      - run: make demo
      - run: make test-configs
  isolated-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install uv==0.9.7
      - run: uv sync --locked
      - run: make test-lab
